{% extends "base.html" %}{% block title %}로그인{% endblock %}
{% block content %}
<div class="card auth">
  <h1>로그인</h1>
  <form method="post">
    <div class="field"><label>아이디</label><input type="text" name="login_id" required autofocus></div>
    <div class="field"><label>비밀번호</label><input type="password" name="password" required></div>
    <button type="submit">로그인</button> <a class="btn secondary" href="{{ url_for('auth.signup') }}">회원가입</a>
  </form>
  <p class="muted small" style="margin-top:14px">데모 계정 (비밀번호 공통 <code>pass1234</code>): 경영진 <code>ceo</code>, <code>exec01</code> · PM <code>pm01</code> · 개발자 <code>dev01</code></p>
</div>
{% endblock %}
